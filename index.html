<style>

}

  }
}
:root[data-theme="dark"] {

  --accent: #3cb8b6; --accent-ink: #0c1214; --discount: #d884b6; --salary: #e0a24e; --ok: #5cc98a; --warn: #ff8a80;

* { box-sizing: border-box; }

}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wrap { max-width: 1020px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }

.sub { color: var(--ink-soft); margin: 0 0 20px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.grid > .panel:first-child { container: kasaInputs / inline-size; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: var(--ink-soft); }
label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
label small { font-weight: 400; color: var(--ink-soft); }
input[type=text], input[type=number] {
  width: 100%; font: inherit; font-size: 18px; font-weight: 600; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: end; }
/* Split currency and exchange values only when the INPUT panel itself is wide enough. */
@container kasaInputs (min-width: 720px) {
  .row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink); min-width: 48px;
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* Independent basis selector: stays readable on narrow phones. */
.calc-basis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.calc-basis button { min-width: 0; white-space: normal; overflow-wrap: anywhere; text-align: center; line-height: 1.3; }
.chain { display: flex; flex-direction: column; }
.step { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--paper); min-width: 0; max-width: 100%; }
.step .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.step .hint { display: block; font-weight: 400; font-size: 13px; color: var(--ink-soft); }
.step .val { font-size: clamp(20px, 2.8vw, 26px); font-weight: 800; white-space: nowrap; flex-shrink: 0; }
.step.big { background: var(--ink); color: var(--paper); }
.step.big .hint { color: inherit; opacity: .75; }
.step.big .val { font-size: clamp(22px, 3.5vw, 30px); }
.cut { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 14px 6px 28px; font-size: 15px; border-left: 3px solid var(--line); margin-left: 14px; min-width: 0; }
.cut.d { border-color: var(--discount); } .cut.d .amt { color: var(--discount); }
.cut.s { border-color: var(--salary); } .cut.s .amt { color: var(--salary); }
.cut.x { border-color: var(--ink-soft); } .cut.x .amt { color: var(--ink-soft); }
.cut .amt { font-weight: 800; flex-shrink: 0; }
#out { min-width: 0; max-width: 100%; }
.status { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--paper); }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-soft); }
tr.pick td { font-weight: 800; color: var(--accent); }
tr.bad td { color: var(--ink-soft); opacity: .7; }
.tablewrap { overflow-x: auto; }
details { margin-top: 14px; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.expl ol { margin: 10px 0 0; padding-left: 20px; }
.expl li { margin-bottom: 8px; }
.empty { color: var(--ink-soft); padding: 30px 6px; text-align: center; }
.foot { margin-top: 16px; color: var(--ink-soft); font-size: 13px; }
input[type=date] { width: 100%; font: inherit; font-size: 18px; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
select { font: inherit; font-size: 18px; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 6px; }
.inp2.two { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 10px; align-items: end; } .inp2.two > div { min-width: 0; }
.curres { display: flex; align-items: center; width: 100%; min-height: 50px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; font-size: clamp(18px, 2vw, 18px); font-weight: 600; color: var(--accent); white-space: normal; overflow-wrap: anywhere; }
.inp2 { display: flex; gap: 6px; } .inp2 input { min-width: 0; flex: 1; }
/* Keep the whole amount visible on narrow phones instead of clipping it. */
@media (max-width: 430px) {
  .curres { font-size: 18px; }
}
.saverow { display: flex; gap: 10px; align-items: flex-end; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.saverow > div { flex: 1; min-width: 150px; } .saverow label { margin-top: 0; }
button.primary { font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; padding: 11px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); }
button.ghost { font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
#clr.confirm-clear { color: #b3261e; }
.savemsg, .jmsg { min-height: 20px; margin-top: 8px; font-size: 14px; color: var(--ok); }
.jr { margin-top: 16px; }
.jhead { display: flex; justify-content: space-between; align-items: baseline; }
.jhead span { color: var(--ink-soft); font-size: 14px; }
.jbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
/* Journal: consistent columns; horizontal scrolling on narrow phones. */
.jr .tablewrap { width: 100%; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.jr .tablewrap table { min-width: 760px; table-layout: fixed; }
.jr .tablewrap th, .jr .tablewrap td { text-align: center; vertical-align: middle; padding: 9px 8px; overflow-wrap: anywhere; }
.jr .tablewrap th:first-child, .jr .tablewrap td:first-child { text-align: center; white-space: nowrap; }
.jr .tablewrap th:nth-child(1) { width: 102px; }
.jr .tablewrap th:nth-child(2) { width: 90px; }
.jr .tablewrap th:nth-child(3) { width: 180px; }
.jr .tablewrap th:nth-child(4) { width: 95px; }
.jr .tablewrap th:nth-child(5) { width: 105px; }
.jr .tablewrap th:nth-child(6) { width: 110px; }
.jr .tablewrap th:nth-child(7) { width: 42px; }
.jr .tablewrap th:nth-child(3), .jr .tablewrap td:nth-child(3) { text-align: center; }
.jr .tablewrap thead th { white-space: nowrap; }
td button.x { font: inherit; font-size: 18px; line-height: 1; cursor: pointer; border: 0; background: transparent; color: var(--warn); padding: 2px 8px; }
.dateWrap { position: relative; display: flex; gap: 6px; }
.dateWrap #dateText { flex: 1; min-width: 0; }
.dateBtn { font-size: 20px; line-height: 1; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); cursor: pointer; }
.dateWrap #date { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.pch { font-size: 15px; font-weight: 800; margin: 14px 0 4px; }
:root { --flash: rgba(14, 124, 123, .2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --flash: rgba(60, 184, 182, .3); } }
:root[data-theme="dark"] { --flash: rgba(60, 184, 182, .3); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes flash { from { background-color: var(--flash); } to { background-color: transparent; } }
.chain.enter > * { animation: rise .35s ease both; animation-delay: calc(var(--i, 0) * 55ms); }
.jr tbody tr.flash { animation: flash 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) { .chain.enter > *, .jr tbody tr.flash { animation: none; } }
/* --- Адаптив: узкие экраны --- */
.rg { display: none; }
@media (max-width: 520px) {
  details .tablewrap th:nth-child(3), details .tablewrap td:nth-child(3) { display: none; }
  .rg { display: block; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  details .tablewrap td, details .tablewrap th { padding: 7px 4px; }
}
@media (max-width: 360px) {
  h1 { font-size: 22px; }
  .top { gap: 8px; }
  .lang { margin-top: 8px; }
  .lang button { padding: 5px 8px; }

/* KASA 8 THEMES. Standalone additions; original CSS above left untouched. */
.theme-dock {display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:-5px 0 14px;min-width:0}
.theme-dock label {margin:0;font:inherit;font-size:16px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.theme-label-wrap{display:inline-flex;align-items:center;gap:8px}
.theme-label-icon{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;flex:0 0 29px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.theme-label-icon svg{display:block;width:29px;height:29px}
.theme-dock select {min-width:0;width:min(290px,69vw);min-height:44px;padding:8px 10px;border-radius:12px;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.currency-flags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}

.currency-flag:active{transform:translateY(1px)}
.currency-flag:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.currency-flag.active{color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),inset 0 1px 2px rgba(255,255,255,.15),0 4px 9px rgba(0,0,0,.12)}
.currency-flag b{font-weight:700;color:inherit}
.currency-flag .flag{font-size:24px;line-height:1}
.theme-dock select:focus-visible {outline:3px solid var(--accent);outline-offset:2px}
/* Important: Android WebView native select menus may otherwise show white-on-white options in dark themes. */
select, .theme-dock select { color-scheme:light!important; }

/* Keep both the currency selector and theme selector readable even if the OS draws a white option popup. */

@media (max-width:360px){ .theme-dock{gap:7px}.theme-dock select{width:min(245px,70vw);font-size:13px;padding:8px}}

/* Isolated material system: only new edition-* themes inherit these overrides. */
html[data-kasa-ui^="edition-"]{color-scheme:dark;}
html[data-kasa-ui^="edition-"] body{
 background:
   radial-gradient(ellipse 110% 50% at 0% 0%,var(--th-bg1),transparent 72%),
   radial-gradient(ellipse 86% 42% at 100% 54%,var(--th-bg3),transparent 78%),
   linear-gradient(155deg,var(--th-bg2),var(--th-bg4));
 background-attachment:fixed;
}
html[data-kasa-ui^="edition-"] .panel{
 border-radius:var(--th-radius); border:1px solid var(--th-edge);
 background:
   linear-gradient(133deg,rgba(255,255,255,.28),transparent 17%,transparent 81%,rgba(0,0,0,.17)),
   linear-gradient(145deg,var(--th-panel1),var(--th-panel2));
 box-shadow:
   inset 2px 2px 2px rgba(255,255,255,.24),
   inset -2px -3px 9px rgba(0,0,0,.30),

}

html[data-kasa-ui^="edition-"] {background-color:var(--paper);color-scheme:light;} html[data-kasa-ui^="edition-"] body{background-attachment:scroll;}
/* KASA CUSTOM DROPDOWNS: isolated presentation, no edits to calculator logic or original themes. */
.kasa-native-select {
  position:absolute!important; width:1px!important; height:1px!important; min-width:0!important;
  margin:-1px!important; padding:0!important; border:0!important; opacity:0!important;
  pointer-events:none!important; overflow:hidden!important; clip-path:inset(100%)!important;
}
.theme-dock {position:relative;z-index:30}
.theme-dock .kasa-dd-themes{flex:0 1 290px;width:100%;min-width:0}
.grid > .panel:first-child{position:relative;z-index:2}
.kasa-dd{position:relative;min-width:0}
.kasa-dd.is-open{z-index:110}
.kasa-dd-currency{flex:0 0 93px;width:93px;align-self:stretch}
.kasa-dd-trigger{
  width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;
  gap:8px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);
  background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,white 4%),color-mix(in srgb,var(--surface) 82%,var(--paper) 18%));
  color:var(--ink);-webkit-text-fill-color:var(--ink);font:inherit;font-size:14px;font-weight:600;line-height:1.35;
  text-align:left;cursor:pointer;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 4px 11px rgba(0,0,0,.12);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,filter .2s ease;
  -webkit-tap-highlight-color:transparent;
}
.kasa-dd-trigger:active{transform:translateY(1px)}
.kasa-dd-trigger:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kasa-dd.is-open .kasa-dd-trigger{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 21%,transparent),0 8px 16px rgba(0,0,0,.17)}
.kasa-dd-value{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kasa-dd-themes .kasa-dd-value{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kasa-dd-chevron{width:9px;height:9px;flex:none;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .22s ease}
.kasa-dd.is-open .kasa-dd-chevron{transform:translateY(2px) rotate(225deg)}
.kasa-dd-flag{font-size:21px;line-height:1;flex-shrink:0;-webkit-text-fill-color:initial}
.kasa-dd-menu{
  position:absolute;z-index:130;top:calc(100% + 9px);left:0;width:100%;
  display:flex;flex-direction:column;gap:5px;max-height:min(52vh,370px);
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:9px;border:1px solid var(--line);border-radius:18px;
  background:var(--surface);
  background:linear-gradient(155deg,color-mix(in srgb,var(--surface) 88%,var(--paper) 12%),var(--surface));
  box-shadow:0 18px 38px rgba(0,0,0,.24),inset 0 1px 1px rgba(255,255,255,.24);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(-8px) scale(.975);transform-origin:top right;
  transition:opacity .22s ease,transform .24s cubic-bezier(.2,.9,.2,1);
}
.kasa-dd.is-open .kasa-dd-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}
.kasa-dd-currency .kasa-dd-menu{left:auto;right:0;width:205px;max-width:calc(100vw - 30px)}
.kasa-dd-option{
  width:100%;min-height:44px;flex:none;display:flex;align-items:center;gap:10px;
  text-align:left;padding:9px 11px;border:1px solid transparent;border-radius:12px;
  color:var(--ink);-webkit-text-fill-color:var(--ink);font:inherit;font-size:14px;font-weight:600;
  line-height:1.35;background:transparent;cursor:pointer;
  transition:background .16s ease,border-color .16s ease,transform .16s ease;
}
.kasa-dd-option:active{transform:scale(.985)}
.kasa-dd-option:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kasa-dd-option[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 17%,var(--surface));border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.kasa-dd-option:hover{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.kasa-dd-option-text{flex:1;min-width:0}
.kasa-dd-option[aria-selected="true"]::after{content:'✓';color:var(--accent);-webkit-text-fill-color:var(--accent);font-weight:800;font-size:18px}
.kasa-dd-swatch{width:23px;height:23px;flex:0 0 23px;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,var(--sw1),var(--sw2));box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -2px 3px rgba(0,0,0,.19),0 2px 5px rgba(0,0,0,.17)}
.kasa-dd-currency .kasa-dd-option{min-height:51px;font-size:16px}
.kasa-dd-currency .kasa-dd-option .kasa-dd-flag{font-size:24px}
@media(max-width:360px){.theme-dock .kasa-dd-trigger{font-size:13px;padding-left:9px;padding-right:9px}.kasa-dd-currency{flex-basis:82px;width:82px}.kasa-dd-trigger{padding-left:8px;padding-right:8px}}
@media(prefers-reduced-motion:reduce){.kasa-dd-trigger,.kasa-dd-option,.kasa-dd-chevron,.kasa-dd-menu{transition:none!important}}


/* ========================================================================
   NEON GLASS ULTRA 3D — isolated, removable visual experiment.
   All rules require html[data-kasa-ui="neon"]. Other 12 themes are untouched.
   CSS only: no library, shader, network resource or change to calculations.
   ======================================================================== */
html[data-kasa-ui="neon"] {
  --ultra-cyan: #5decff;
  --ultra-pink: #fd71cb;
  --ultra-shell: #101e38;
  --ultra-shadow: rgba(0, 3, 17, .70);
}

/* Deep frosted-cobalt stage, dimensional neon environment behind glass. */
html[data-kasa-ui="neon"] body {
  background:

/* All 11 non-neon custom themes: material lighting and layered physical depth. */
html[data-kasa-ui]:not([data-kasa-ui="neon"]) .panel {
 position:relative;isolation:isolate;
 border:1px solid var(--u-edge);border-radius:var(--u-round);
 background:
  linear-gradient(115deg,rgba(255,255,255,.27),transparent 21%,transparent 74%,rgba(0,0,0,.08)),
  radial-gradient(ellipse 75% 43% at 93% 1%,var(--u-gloss),transparent 80%),
  var(--u-tex),
  linear-gradient(150deg,var(--u-panel1),var(--u-panel2));
 box-shadow:
  inset 0 2px 2px var(--u-gloss),inset 2px 0 1px rgba(255,255,255,.2),
  inset -2px -3px 3px rgba(0,0,0,.16),inset 0 -9px 16px rgba(0,0,0,.1),
  0 3px 0 var(--u-side),0 5px 0 var(--u-shade),
  0 11px 20px rgba(0,0,0,.25),0 21px 36px rgba(0,0,0,.18);
}

 content:"";position:absolute;pointer-events:none;z-index:0;
 top:2px;bottom:2px;left:2px;right:2px;border-radius:inherit;

  linear-gradient(151deg,var(--u-f1),var(--u-f2));
 box-shadow:inset 0 3px 7px rgba(0,0,0,.13),inset 0 1px 2px rgba(0,0,0,.07),
  inset 0 -1px 1px var(--u-gloss),0 1px 0 rgba(255,255,255,.26),0 4px 8px rgba(0,0,0,.08);

    h += '<li><b>' + t('s4') + '</b> ' + t('s4d') + ' ' + fmt2(M / J) + ' × ' + pick.t + '% = ' + fmt2((M / J) * d) + '. ' + t('s4s') + ' ' + fmt2(M / J) + ' × ' + salTxt + '% = ' + fmt2((M / J) * s) + '.</li>';
    h += '</ol><p>' + t('one') + ' ' + fmt(M) + ' / ' + J.toFixed(5) + ' = ' + fmt2(M / J) + '.</p></details>';

    var pd = pick.t, pa = 100 - pd, ps = num($('sal').value), pb = 100 - ps, pr = J * 100;
    var pv = { d: nf(pd, 4), a: nf(pa, 4), s: nf(ps, 4), b: nf(pb, 4), r: nf(pr, 4),
      k1: nf(d, 5), k2: nf(s, 5), j: nf(J, 5) };
    h += '<details class="expl"><summary>' + t('pctTitle') + '</summary>' +
      '<h3 class="pch">' + t('pcH1') + '</h3><ol><li>' + t('pc1a') + '</li><li>' + t('pc1b', pv) + '</li><li>' + t('pg1c', pv) + '</li><li>' + t('pg1d', pv) + '</li></ol>' +
      '<h3 class="pch">' + t('pcH2') + '</h3><p>' + t('pc2a', pv) + '</p><ol><li>' + t('pg2b', pv) + '</li><li>' + t('pg2c', pv) + '</li></ol><p>' + t('pg2d', pv) + '</p></details>';

    var wasOpen = Array.prototype.map.call(out.querySelectorAll('details'), function (x) { return x.open; });
    out.innerHTML = h;
    var nd = out.querySelectorAll('details');
    if (wasOpen.length === nd.length) Array.prototype.forEach.call(nd, function (x, i) { x.open = wasOpen[i]; });
    // Цепочка плавно проявляется только при первом расчёте
    var chEl = out.querySelector('.chain');
    if (chEl && !chainShown) {
      chEl.classList.add('enter');
      Array.prototype.forEach.call(chEl.children, function (c, i) { c.style.setProperty('--i', i); });
    }
    chainShown = true;
    animateNumbers(out);
  }

  ['cash', 'usd', 'rate', 'exp', 'sal'].forEach(function (id) { $(id).addEventListener('input', function () { saveDraft(); render(); }); });
  ['sym', 'date'].forEach(function (id) { $(id).addEventListener('change', function () { saveDraft(); render(); }); });
  window.addEventListener('pagehide', saveDraft);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveDraft(); });

  $('disc').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    mode = b.getAttribute('data-v');
    saveDraft();
    Array.prototype.forEach.call($('disc').children, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    render();
  });

  $('out').addEventListener('click', function (e) {
    var sum = e.target.closest ? e.target.closest('summary') : null;
    if (!sum || reduceMotion()) return;
    var d = sum.parentNode;
    if (!d || d.tagName !== 'DETAILS' || !d.animate) return;
    e.preventDefault();
    if (d._anim) { d._anim.cancel(); d._anim = null; }
    var from = d.offsetHeight, opening = !d.open, to;
    d.style.overflow = 'hidden';
    if (opening) { d.open = true; to = d.offsetHeight; } else { to = sum.offsetHeight; }
    var a = d.animate({ height: [from + 'px', to + 'px'] }, { duration: 220, easing: 'ease-out' });
    d._anim = a;
    a.onfinish = function () { if (!opening) d.open = false; d.style.overflow = ''; d._anim = null; };
    a.oncancel = function () { d.style.overflow = ''; };
  });

  $('lang').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    lang = b.getAttribute('data-l');
    try { localStorage.setItem('kasa_lang', lang); } catch (err) {}
    applyStatic();
    render();
    renderJournal();
  });

  // ---------- Журнал ----------
  var journal = [];
  try { journal = JSON.parse(localStorage.getItem('kasa_journal') || '[]'); if (!Array.isArray(journal)) journal = []; } catch (e) { journal = []; }
  function saveJournal() { try { localStorage.setItem('kasa_journal', JSON.stringify(journal)); } catch (e) {} }
  function escH(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function todayISO() { var d = new Date(), m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd; }
  function dmy(iso) { var p = String(iso).split('-'); return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso; }

  function renderJournal() {
    $('jcount').textContent = journal.length ? t('jCount', { n: journal.length }) : '';
    if (!journal.length) { $('jbody').innerHTML = '<div class="empty">' + t('jEmpty') + '</div>'; return; }
    var h = '<div class="tablewrap"><table><thead><tr><th>' + t('jhD') + '</th><th>' + t('jhK') + '</th><th>' + t('jhC') + '</th><th>' + t('jhV') + '</th><th>' + t('jhZ') + '</th><th>' + t('jhG') + '</th><th></th></tr></thead><tbody>';
    journal.forEach(function (e, i) {
      h += '<tr><td>' + dmy(e.date) + '</td><td>' + fmt(e.cash) + '</td><td>' + escH(e.cur) + '</td><td>' + escH(e.exp) + '</td><td>' + fmt(e.E) + ' (' + e.d + '%)</td><td><b>' + fmt(e.F) + '</b></td><td><button type="button" class="x" data-i="' + i + '" aria-label="' + t('delAria') + '">×</button></td></tr>';
    });
    $('jbody').innerHTML = h + '</tbody></table></div>';
  }

  function downloadBlob(blob, name) {
    var a = document.createElement('a'), u = URL.createObjectURL(blob);
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 1000);
  }
  function deliver(blob, name) {
    if (window.KasaAndroid && typeof window.KasaAndroid.saveExcel === 'function') {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var base64 = String(reader.result).split(',')[1];
            if (window.KasaAndroid.saveExcel(name, base64)) resolve();
            else reject(new Error('Android save failed'));
          } catch (e) { reject(e); }
        };
        reader.onerror = function () { reject(new Error('File reading failed')); };
        reader.readAsDataURL(blob);
      });
    }
    // In the Android app, a browser-style blob download cannot confirm a saved file.
    if (/Android/i.test(navigator.userAgent)) {
      return Promise.reject(new Error('Android bridge unavailable: install updated APK with MainActivity.java'));
    }
    var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent), file = null;
    try { file = new File([blob], name, { type: blob.type }); } catch (e) {}
    if (mobile && file && navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: name }).catch(function (err) { if (!(err && err.name === 'AbortError')) downloadBlob(blob, name); });
    }
    downloadBlob(blob, name);
    return Promise.resolve();
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (res, rej) {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); ok ? res() : rej();
    });
  }

  $('save').addEventListener('click', function () {
    if (!current) { $('savemsg').textContent = t('noSave'); return; }
    var isoD = parseDMY($('dateText').value);
    if (!isoD) { $('savemsg').textContent = t('dateBad'); return; }
    var raw = current.exp;
    journal.push({
      date: isoD,
      cash: current.cash, cur: current.curText, exp: raw,
      expNum: /^\d+(?:[.,]\d+)?$/.test(raw) ? parseFloat(raw.replace(',', '.')) : null,
      d: current.d, E: current.E, F: current.F
    });
    saveJournal(); renderJournal();
    var jrows = $('jbody').querySelectorAll('tbody tr');
    if (jrows.length) jrows[jrows.length - 1].classList.add('flash');
    $('savemsg').textContent = t('saved');
  });
  $('jbody').addEventListener('click', function (e) {
    var b = e.target.closest('button.x');
    if (!b) return;
    journal.splice(Number(b.getAttribute('data-i')), 1);
    saveJournal(); renderJournal();
  });
  $('xl').addEventListener('click', function () {
    if (!journal.length) { $('jmsg').textContent = t('jEmpty'); return; }
    var name = 'kasa_' + todayISO() + '.xlsx';
    deliver(XL.build(journal), name).then(function () { $('jmsg').textContent = t('xlDone', { f: name }); }, function () { $('jmsg').textContent = lang === 'uk' ? 'Не вдалося зберегти Excel у Завантаження. Перевірте, чи встановлено оновлений APK.' : 'Не удалось сохранить Excel в Загрузки. Проверьте, установлен ли обновлённый APK.'; });
  });
  $('cp').addEventListener('click', function () {
    if (!journal.length) { $('jmsg').textContent = t('jEmpty'); return; }
    var rows = journal.map(function (e) { return [dmy(e.date), e.cash, e.cur, e.exp, e.E, e.F].join('\t'); }).join('\n');
    copyText(rows).then(function () { $('jmsg').textContent = t('copied'); }, function () { $('jmsg').textContent = t('copyFail'); });
  });
  var clrTimer = null;
  $('clr').addEventListener('click', function () {
    if (!journal.length) return;
    if (clrTimer) {
      clearTimeout(clrTimer);
      clrTimer = null;
      journal = [];
      saveJournal();
      renderJournal();
      $('clr').textContent = t('clr');
      $('clr').classList.remove('confirm-clear');
      try {
        if (window.KasaAndroid && typeof window.KasaAndroid.journalCleared === 'function') {
          window.KasaAndroid.journalCleared();
        }
      } catch (e) {}
      return;
    }
    $('clr').textContent = t('clr2');
    $('clr').classList.add('confirm-clear');
    clrTimer = setTimeout(function () { clrTimer = null; $('clr').textContent = t('clr'); $('clr').classList.remove('confirm-clear'); }, 4000);
  });

  function parseDMY(str) {
    var m = String(str).trim().match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
    if (!m) return null;
    var d = +m[1], mo = +m[2], y = +m[3], dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
  }
  function setDate(iso) { $('date').value = iso; $('dateText').value = dmy(iso); }
  var datePrev = '';
  $('dateText').addEventListener('focus', function () { datePrev = this.value; });
  $('dateText').addEventListener('blur', function () { var iso = parseDMY(this.value); if (iso) this.value = dmy(iso); });
  $('dateText').addEventListener('input', function (ev) {
    var el = this, v = el.value, pos = el.selectionStart;
    var type = (ev && ev.inputType) || '';
    var del = type.indexOf('delete') === 0;
    var clean = v.replace(/[^\d.]/g, '');
    if (clean !== v) { pos = v.slice(0, pos).replace(/[^\d.]/g, '').length; v = clean; }
    if (del) {
      // Удаление: ничего не пересобираем, чтобы цифры не «съезжали» из года.
      // Если стёрли точку, стираем соседнюю цифру, а точку оставляем.
      if (datePrev.length - v.length === 1 && datePrev.charAt(pos) === '.') {
        if (type === 'deleteContentForward') v = datePrev.slice(0, pos + 1) + datePrev.slice(pos + 2);
        else { v = datePrev.slice(0, pos - 1) + datePrev.slice(pos); pos = pos - 1; }
      }
      el.value = v; el.setSelectionRange(pos, pos);
    } else {
      // Ввод: расставляем точки и возвращаем курсор на то же место (по числу цифр слева)
      var before = v.slice(0, pos).replace(/\D/g, '').length, atEnd = pos >= v.length;
      var dg = v.replace(/\D/g, '').slice(0, 8), o = dg;
      if (dg.length > 4) o = dg.slice(0, 2) + '.' + dg.slice(2, 4) + '.' + dg.slice(4);
      else if (dg.length > 2) o = dg.slice(0, 2) + '.' + dg.slice(2);
      var np = o.length;
      if (!atEnd) {
        np = 0;
        for (var i = 0, c = 0; i < o.length && c < before; i++) { if (/\d/.test(o.charAt(i))) c++; np = i + 1; }
      }
      el.value = o; el.setSelectionRange(np, np);
    }
    datePrev = el.value;
    var iso = parseDMY(el.value); if (iso) $('date').value = iso;
    saveDraft();
  });
  $('dateBtn').addEventListener('click', function () {
    var el = $('date'), iso = parseDMY($('dateText').value);
    if (iso) el.value = iso;
    try { if (el.showPicker) { el.showPicker(); return; } } catch (e) {}
    el.focus(); el.click();
  });
  $('date').addEventListener('change', function () { if (this.value) { $('dateText').value = dmy(this.value); saveDraft(); } });
  setDate(todayISO());
  restoreDraft();
  if ($('date').value) $('dateText').value = dmy($('date').value);
  applyStatic();
  render();
  renderJournal();
})();
</script>
<script>
/* UI theme picker: wholly separate from calculation, journal, and Excel code. */
(function () {
 var picker=document.getElementById('kasaTheme'), label=document.getElementById('kasaThemeLabel');
 var themeText=label.querySelector('.theme-label-text');
 var modes=['standard','pastel','neon','felt','surreal','holo','clay','plush','edition-ice','edition-emerald','edition-titanium','edition-porsche','edition-tropical'];
 function applyTheme(value) {
  var next=modes.indexOf(value)!==-1?value:'standard';
  if (next==='standard') document.documentElement.removeAttribute('data-kasa-ui');
  else document.documentElement.setAttribute('data-kasa-ui',next);
  picker.value=next;
  try{localStorage.setItem('kasa_visual_theme_v1',next)}catch(e){}
 }
 function syncLanguage(){
  var uk=document.documentElement.lang==='uk';
  if(themeText) themeText.textContent='Тема';
  picker.options[0].textContent=uk?'Стандартна':'Стандартная';
  var currencies=document.getElementById('currencyFlags');
  if(currencies) currencies.setAttribute('aria-label', uk?'Вибір валюти':'Выбор валюты');
 }
 function syncCurrencyFlags(){
  var sym=document.getElementById('sym');
  var list=document.getElementById('currencyFlags');
  if(!sym || !list) return;
  list.querySelectorAll('.currency-flag').forEach(function(el){
   var active=el.getAttribute('data-sym')===sym.value;
   el.classList.toggle('active',active);
   el.setAttribute('aria-pressed',active?'true':'false');
  });
 }
 var initial=document.documentElement.getAttribute('data-kasa-ui')||'standard';
 picker.value=initial;
 syncLanguage();
 syncCurrencyFlags();
 picker.addEventListener('change',function(){applyTheme(this.value)});
 document.getElementById('lang').addEventListener('click',syncLanguage);
 var symPicker=document.getElementById('sym');
 if(symPicker) symPicker.addEventListener('change',syncCurrencyFlags);
 var flags=document.getElementById('currencyFlags');
 if(flags && symPicker) flags.addEventListener('click',function(event){
  var btn=event.target.closest('button[data-sym]');
  if(!btn || !flags.contains(btn)) return;
  var next=btn.getAttribute('data-sym');
  if(symPicker.value!==next){
   symPicker.value=next;
   symPicker.dispatchEvent(new Event('change',{bubbles:true}));
  } else {
   syncCurrencyFlags();
  }
 });
})();
</script>
<script>
/* Animated custom menus wrap the original SELECT values. Existing saving/calculation code stays untouched. */
(function(){
  'use strict';
  var cfg=[
    {kind:'themes',source:'kasaTheme',trigger:'kasaThemeTrigger',menu:'kasaThemeMenu',display:'kasaThemeText'},
    {kind:'currency',source:'sym',trigger:'kasaCurrencyTrigger',menu:'kasaCurrencyMenu',display:'kasaCurrencyText'}
  ];
  var palettes={
    standard:['#ffffff','#0e7c7b'],pastel:['#fbe1d3','#b878c4'],neon:['#03ebef','#f654c9'],
    felt:['#fff0ee','#e49aaa'],surreal:['#272e35','#e8a8a1'],holo:['#f9ffff','#a3bdfe'],
    clay:['#f7e9d3','#85c3b9'],plush:['#a4c3ef','#f1a9c6'],
    'edition-ice':['#d9ebff','#3569b9'],'edition-emerald':['#1c5740','#91f38c'],
    'edition-titanium':['#0c2241','#a3d3ff'],'edition-porsche':['#06172e','#86b6e9'],
    'edition-tropical':['#182a27','#c7a082']
  };
  var menus=[];
  cfg.forEach(function(c){
    c.select=document.getElementById(c.source);
    c.button=document.getElementById(c.trigger);
    c.list=document.getElementById(c.menu);
    c.displayEl=document.getElementById(c.display);
    c.root=c.button.parentElement;
    if(!c.select||!c.button||!c.list) return;
    c.items=[];
    Array.prototype.forEach.call(c.select.options,function(opt,i){
      var item=document.createElement('button');
      item.type='button';item.className='kasa-dd-option';item.setAttribute('role','option');
      item.setAttribute('data-value',opt.value);item.setAttribute('tabindex','-1');
      var marker=document.createElement('span');
      if(c.kind==='themes'){
        marker.className='kasa-dd-swatch';
        marker.style.setProperty('--sw1',(palettes[opt.value]||palettes.standard)[0]);
        marker.style.setProperty('--sw2',(palettes[opt.value]||palettes.standard)[1]);
        marker.setAttribute('aria-hidden','true');
      }else{
        marker.className='kasa-dd-flag';marker.textContent=opt.value==='$'?'🇺🇸':'🇪🇺';
        marker.setAttribute('aria-hidden','true');
      }
      var caption=document.createElement('span');caption.className='kasa-dd-option-text';
      caption.textContent=c.kind==='themes'?opt.textContent:(opt.value==='$'?'$ · USD':'€ · EUR');
      item.appendChild(marker);item.appendChild(caption);
      item.id=c.menu+'-opt'+i;
      item.addEventListener('click',function(){choose(c,opt.value)});
      item.addEventListener('keydown',function(e){onItemKey(e,c,i)});
      c.list.appendChild(item);c.items.push(item);
    });
    c.button.addEventListener('click',function(){c.root.classList.contains('is-open')?close(c,true):open(c,false)});
    c.button.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){
        e.preventDefault();open(c,true,e.key==='ArrowUp');
      }else if(e.key==='Escape'){close(c,true)}
    });
    c.select.addEventListener('change',function(){sync(c)});
    sync(c);menus.push(c);
  });
  function sync(c){
    var val=c.select.value;
    if(c.kind==='themes'){
      c.displayEl.textContent=c.select.options[c.select.selectedIndex]?c.select.options[c.select.selectedIndex].textContent:'Стандартная';
    }else{
      c.displayEl.textContent='';
      var flag=document.createElement('span');flag.className='kasa-dd-flag';flag.textContent=val==='$'?'🇺🇸':'🇪🇺';
      var text=document.createElement('span');text.textContent=val;
      c.displayEl.appendChild(flag);c.displayEl.appendChild(text);
      c.button.setAttribute('aria-label',document.documentElement.lang==='uk'?'Валюта: '+(val==='$'?'долар США':'євро'):'Валюта: '+(val==='$'?'доллар США':'евро'));
      c.list.setAttribute('aria-label',document.documentElement.lang==='uk'?'Вибір валюти':'Выбор валюты');
    }
    c.items.forEach(function(el,i){
      el.setAttribute('aria-selected',c.select.options[i].value===val?'true':'false');
      if(c.kind==='themes')el.querySelector('.kasa-dd-option-text').textContent=c.select.options[i].textContent;
    });
  }
  function close(c,restore){
    c.root.classList.remove('is-open');c.button.setAttribute('aria-expanded','false');
    c.button.removeAttribute('aria-activedescendant');
    if(restore)c.button.focus({preventScroll:true});
  }
  function open(c,focus,last){
    menus.forEach(function(other){if(other!==c)close(other,false)});
    c.root.classList.add('is-open');c.button.setAttribute('aria-expanded','true');
    var index=c.select.selectedIndex;
    if(last)index=c.items.length-1;
    if(index<0)index=0;
    var item=c.items[index];
    if(item){item.scrollIntoView({block:'nearest'});if(focus)requestAnimationFrame(function(){if(c.root.classList.contains('is-open'))item.focus({preventScroll:true})})}
  }
  function choose(c,value){
    if(c.select.value!==value){
      c.select.value=value;
      c.select.dispatchEvent(new Event('change',{bubbles:true}));
    }
    sync(c);
    close(c,true);
  }
  function onItemKey(e,c,i){
    var next=i;
    if(e.key==='ArrowDown')next=(i+1)%c.items.length;
    else if(e.key==='ArrowUp')next=(i+c.items.length-1)%c.items.length;
    else if(e.key==='Home')next=0;
    else if(e.key==='End')next=c.items.length-1;
    else if(e.key==='Escape'){e.preventDefault();close(c,true);return}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(c,c.items[i].getAttribute('data-value'));return}
    else if(e.key==='Tab'){close(c,false);return}
    else return;
    e.preventDefault();c.items[next].focus({preventScroll:true});c.items[next].scrollIntoView({block:'nearest'});
  }
  document.addEventListener('pointerdown',function(event){menus.forEach(function(c){if(!c.root.contains(event.target))close(c,false)})});
  document.addEventListener('focusin',function(event){menus.forEach(function(c){if(!c.root.contains(event.target))close(c,false)})});
  document.getElementById('lang').addEventListener('click',function(){menus.forEach(sync)});
})();
</script>
